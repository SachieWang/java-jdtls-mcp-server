name: Release and Publish

on:
  push:
    tags:
      - "v*.*.*" # Trigger when a version tag is pushed, e.g., v1.0.0

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    environment: NPMJS
    permissions:
      id-token: write # 关键：允许生成 JWT 令牌
      contents: write # 关键：允许创建 Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to generate accurate changelogs based on git history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Sync version from tag
        run: |
          # 提取 tag 名称并移除 'v' 前缀 (例如将 'v1.0.1' 变成 '1.0.1')
          VERSION=${GITHUB_REF_NAME#v}
          echo "Updating package.json to version $VERSION"
          # 使用 npm version 更新版本号，--no-git-tag-version 防止产生新的 git 提交或标签
          npm version $VERSION --no-git-tag-version

      - name: Debug Auth
        run: |
          echo "--- npm config ---"
          npm config list
          echo "--- npm config get registry ---"
          npm config get registry
          echo "--- ls -a ---"
          ls -a # 查看是否有隐藏的 .npmrc

      - name: Publish to npmjs
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # Automatically generate release notes from commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub Actions
